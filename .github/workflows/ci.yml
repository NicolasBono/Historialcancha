name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    # Por job y no arriba de todo: sólo este job publica, sólo este escribe paquetes.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      # ── desde acá, el TP5: los tests y su umbral ──

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test        # se detiene en la etapa de tests, no llega al runtime
          load: true          # la baja al Docker local: sin esto el docker run no la encuentra
          push: false
          tags: backend-test:ci
          # Su propio estante de cache. Ahora el repo construye cuatro cosas
          # distintas (test e imagen final, del back y del front) y sin un scope
          # por cada una se pisan el cache entre ellas.
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage y umbral
        # El ENTRYPOINT de la etapa ya trae el umbral (60 sobre línea y rama, sobre
        # el total). Si la cobertura no llega, dotnet test sale con error, el docker
        # run devuelve ese error y el job se pone rojo con todos los tests en verde.
        run: docker run --rm -v "${{ github.workspace }}/TestResults:/out" backend-test:ci

      - name: Reporte de coverage del backend
        if: ${{ !cancelled() }}   # también cuando los tests fallaron: es cuando más se quiere mirar
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          # UN asterisco, no dos: el logger trx deja una COPIA del XML en otra
          # subcarpeta, y con ** el reporte la cuenta dos veces y el Summary sale
          # como "MultiReport (2x Cobertura)".
          # Y no lleva -classfilters: lo que queda afuera de la cuenta sale de los
          # atributos [ExcludeFromCodeCoverage] del código, que respetan las dos
          # herramientas. Así el número que frena y el que se muestra son el mismo.
          reportgenerator \
            -reports:"TestResults/*/coverage.cobertura.xml" \
            -sourcedirs:backend \
            -targetdir:coveragereport \
            -reporttypes:"Html;MarkdownSummaryGithub"
          cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage y los resultados del backend
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: |
            coveragereport
            TestResults/tests.trx

      # ── desde acá, el TP6: el artefacto ──
      # Estos dos pasos van ÚLTIMOS y sin !cancelled(): si los tests fallaron,
      # el job murió antes y nunca se llega a publicar. La condición es el orden.

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # A mano y en minúsculas: github.repository trae mayúsculas y ghcr las rechaza.
          tags: ghcr.io/nicolasbono/historialcancha-backend:sha-${{ github.sha }}
          # El commit queda adentro de la imagen y /api/health lo devuelve: es lo que
          # deja comprobar desde afuera qué imagen está corriendo cada entorno.
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      # ── desde acá, el TP5 ──

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage y umbral
        # COVERAGE_DIR le dice a vitest dónde dejar el reporte, y /salida está
        # montado sobre frontend-coverage del runner: por eso el reporte aparece
        # afuera. Si se cambia una de las tres rutas, hay que cambiar las tres.
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"    # si no está, el paso FALLA: mejor rojo que un resumen vacío
          node -e "
            const t = require('./$F').total;
            // El segundo freno, y es el que este práctico viene a cerrar: si el
            // include del vitest.config.js no matchea nada, el archivo se escribe
            // igual con total 0 y pct 'Unknown', el umbral ni se evalúa y el job
            // quedaría verde publicando una tabla de Unknown%.
            if (!t.lines.total) { console.error('midio 0 archivos: revisar el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      # ── desde acá, el TP6: el artefacto (último, igual que en el backend) ──

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/nicolasbono/historialcancha-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── desde acá, el TP6: la promoción (CI verde → QA automático) ──

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]     # sin CI verde no hay deploy
    if: github.ref == 'refs/heads/main'        # los PRs verifican; sólo main despliega
    environment: qa                            # hereda los secrets de qa y queda en el historial
    steps:
      # El hook dice QUÉ IMAGEN ejecutar (imgURL), no qué commit construir: Render
      # ya no compila, corre la imagen que este pipeline verificó y publicó.
      # --get --data-urlencode agrega imgURL con & (el hook ya trae ?key=) y le
      # codifica los : y /. La URL del hook va ÚLTIMA: es el único argumento suelto.
      - name: Desplegar en QA la IMAGEN del commit (api + front)
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          IMG_API="ghcr.io/nicolasbono/historialcancha-backend:sha-$GITHUB_SHA"
          IMG_FRONT="ghcr.io/nicolasbono/historialcancha-frontend:sha-$GITHUB_SHA"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test (espera a que QA conteste)
        shell: bash
        env:
          URL_API: https://historialcancha-api-qa.onrender.com
          URL_FRONT: https://historialcancha-front-qa.onrender.com
        run: |
          # Reintenta 30 x 20 s: el free tier duerme el servicio y Render tarda en
          # construir; un curl seco daría falsos rojos. El --max-time va en cada curl
          # porque un servicio despertando acepta la conexión y no contesta.
          #
          # Mi /api/health devuelve 200 aunque la base esté caída (lo informa en el
          # campo baseDeDatos), y los demás endpoints piden login. Por eso la prueba
          # de que la BD responde es leer ese campo, no el código HTTP.
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            SALUD=$(curl -fsS --max-time 10 "$URL_API/api/health" || true)
            # La api tiene que informar el commit que se mandó a desplegar: si todavía
            # contesta la versión anterior (Render sigue construyendo), no cuenta.
            if echo "$SALUD" | grep -q "\"commit\":\"$GITHUB_SHA\"" \
               && echo "$SALUD" | grep -q '"baseDeDatos":"ok"' \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/health" > /dev/null; then
              echo "$SALUD"
              echo "✅ QA responde (API + BD + front + front→api)"; exit 0
            fi
            echo "vuelta $i: todavía no ($SALUD)"
            sleep 20
          done
          echo "❌ QA no respondió a tiempo"; exit 1

  # ── TP7: las pruebas como gate (QA ejecutando la imagen → integración → e2e → PROD) ──

  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa                       # QA ya ejecuta la imagen de ESTA corrida
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install (sin browser)
        run: npm ci                        # sin playwright install: estas pruebas no abren navegador
        working-directory: ./frontend

      # Le habla a la API de QA (no al front) con su base de verdad, sin dobles.
      # El usuario de prueba es fijo y viene de secrets del repo (ver e2e/sesion.js).
      - name: Integración contra la api de QA
        env:
          API_BASE_URL: https://historialcancha-api-qa.onrender.com
          E2E_DNI: ${{ secrets.E2E_DNI }}
          E2E_CONTRASENA: ${{ secrets.E2E_CONTRASENA }}
        run: npx playwright test e2e/api.spec.js
        working-directory: ./frontend

      - name: Publicar reporte de integración
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}            # el reporte importa MÁS cuando falla
        with:
          name: playwright-report-integracion   # distinto del de e2e: dos iguales rompen la corrida
          path: frontend/playwright-report
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: integracion                     # si la api está rota, no se gasta un browser en confirmarlo
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install + browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./frontend

      # Un navegador de verdad sobre el FRONT de QA. API_BASE_URL va igual: antes de
      # empezar se asegura de que el usuario de prueba exista.
      - name: e2e contra QA
        env:
          E2E_BASE_URL: https://historialcancha-front-qa.onrender.com
          API_BASE_URL: https://historialcancha-api-qa.onrender.com
          E2E_DNI: ${{ secrets.E2E_DNI }}
          E2E_CONTRASENA: ${{ secrets.E2E_CONTRASENA }}
        run: npx playwright test e2e/partidos.spec.js   # SU archivo: sin esto vuelve a correr la integración
        working-directory: ./frontend

      - name: Publicar reporte e2e
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 7

  # ── TP6: el gate humano (QA verde → aprobación → PROD) ──

  deploy-prod:
    runs-on: ubuntu-latest
    # EL gate: sin las dos suites en verde contra QA, ni siquiera se pide aprobación.
    # No repite el if de la rama: lo hereda por la cadena de needs desde deploy-qa.
    needs: e2e
    # Acá el workflow SE PAUSA hasta que el reviewer aprueba ("Waiting for review").
    # Los hooks de PROD viven en este environment: sin aprobación no los lee nadie.
    environment: production
    # Evita dos deploys a PROD pisándose. No ordena la cola de aprobaciones: si hay
    # dos corridas esperando, la vieja se rechaza a mano (aprobarla haría retroceder PROD).
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      # La MISMA imagen que QA verificó: el mismo sha-<commit> en el imgURL. Nada se
      # reconstruye entre QA y PROD.
      - name: Desplegar en PROD la MISMA imagen (api + front)
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/nicolasbono/historialcancha-backend:sha-$GITHUB_SHA"
          IMG_FRONT="ghcr.io/nicolasbono/historialcancha-frontend:sha-$GITHUB_SHA"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test PROD
        shell: bash
        env:
          URL_API: https://historialcancha-api-prod.onrender.com
          URL_FRONT: https://historialcancha-front-prod.onrender.com
        run: |
          # El mismo smoke que QA: base OK leída del health (los endpoints de datos
          # piden login) y el front de PROD llegando a SU api.
          echo "Esperando a que PROD esté vivo..."
          for i in $(seq 1 30); do
            SALUD=$(curl -fsS --max-time 10 "$URL_API/api/health" || true)
            # La api tiene que informar el commit que se mandó a desplegar: si todavía
            # contesta la versión anterior (Render sigue construyendo), no cuenta.
            if echo "$SALUD" | grep -q "\"commit\":\"$GITHUB_SHA\"" \
               && echo "$SALUD" | grep -q '"baseDeDatos":"ok"' \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/health" > /dev/null; then
              echo "$SALUD"
              echo "✅ PROD responde (API + BD + front + front→api)"; exit 0
            fi
            echo "vuelta $i: todavía no ($SALUD)"
            sleep 20
          done
          echo "❌ PROD no respondió a tiempo"; exit 1
