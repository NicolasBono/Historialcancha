server {
    listen 80;

    # Sitio multipágina (index / estadisticas / login), NO una SPA con router:
    # una ruta que no existe tiene que dar 404 y no devolver index.html disfrazado.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Todo lo que empiece con /api se reenvía al backend por la red interna de compose.
    # Acá SÍ vale el nombre de servicio, porque quien resuelve es nginx —que corre
    # dentro de la red—, no el browser. Y como para el browser todo sale del mismo
    # origen, no hace falta CORS.
    #
    # El nombre va en una VARIABLE y no escrito dentro del proxy_pass: con el nombre
    # directo, nginx lo resuelve al arrancar y se niega a levantar si el backend
    # todavía no existe ("host not found in upstream"). Con variable, resuelve recién
    # cuando llega un pedido, así el contenedor del front puede correr solo.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://backend:8080;

    location /api/ {
        # SIN barra al final: con barra, nginx reescribe el prefijo y /api/health
        # llegaría al backend como /health — 404 en todas las llamadas.
        proxy_pass $backend_api;
    }
}
